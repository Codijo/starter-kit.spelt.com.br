; Horizon sob Supervisor. Lido pelo [include] do supervisord.conf do container `console`
; (no deploy: .docker/Console/conf.d/supervisord.conf → files = <app>/.supervisord/*.conf).
;
; ⚠️ O caminho abaixo é específico do projeto. Ao instanciar um novo SaaS a partir do
;    kit, troque `api.spelt.kit` pelo diretório do seu app dentro do container
;    (o mesmo find/replace do nome do projeto — ex.: `api.acme.com`).
[program:horizon]
process_name    = %(program_name)s
command         = bash -c "php /var/www/html/api.spelt.kit/artisan horizon --environment=${HORIZON_ENV:-production}"
autostart       = true
autorestart     = true
redirect_stderr = true
stdout_logfile  = /var/www/html/api.spelt.kit/storage/logs/horizon.log
stopwaitsecs    = 3600
